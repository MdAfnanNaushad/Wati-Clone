<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WATI Clone</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<!-- NAVBAR -->
<header class="nav">
  <div class="nav__container">
    <div class="nav__logo">WATI</div>

    <ul class="nav__menu">
      <li class="nav__item">Home</li>
      <li class="nav__item">Features</li>
      <li class="nav__item">Pricing</li>
    </ul>

    <button class="nav__btn">Get Started</button>

    <div class="nav__toggle">☰</div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero__container">
    <div class="hero__content">
      <h1 class="hero__title">
        WhatsApp API for Business Growth
      </h1>
      <p class="hero__subtitle">
        Automate, engage, and convert customers faster
      </p>
      <button class="hero__btn">Start Free Trial</button>
    </div>

    <div class="hero__image">
      <img src="assets/images/hero.png" alt="hero" />
    </div>
  </div>
</section>

<section class="features">
  <div class="features__container">

    <div class="features__card">
      <h3 class="features__title">Automation</h3>
      <p class="features__desc">Automate conversations</p>
    </div>

    <div class="features__card">
      <h3 class="features__title">Broadcast</h3>
      <p class="features__desc">Send bulk messages</p>
    </div>

    <div class="features__card">
      <h3 class="features__title">Analytics</h3>
      <p class="features__desc">Track performance</p>
    </div>

  </div>
</section>
<section class="testimonials">
  <div class="testimonials__container">

    <div class="testimonials__card">
      <p>"Amazing tool!"</p>
      <h4>- User</h4>
    </div>

  </div>
</section>
<section class="cta">
  <h2>Start Your Free Trial Today</h2>
  <button>Get Started</button>
</section>
<footer class="footer">
  <p>© 2026 WATI Clone</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
