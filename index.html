<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WATI Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="nav">
  <div class="nav__container">
    <div class="nav__logo">WATI</div>
    <ul class="nav__menu">
      <li class="nav__item">Home</li>
      <li class="nav__item">Features</li>
      <li class="nav__item">Pricing</li>
    </ul>
    <button class="nav__button">Get Started</button>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero__container">
    <div class="hero__content">
      <h1 class="hero__title">Automate WhatsApp</h1>
      <p class="hero__subtitle">Grow your business faster</p>
      <button class="hero__btn">Start Free Trial</button>
    </div>
    <div class="hero__image">
      <img src="assets/images/hero.png" alt="">
    </div>
  </div>
</section>

<!-- FEATURES -->
<section class="features">
  <div class="features__container">
    <div class="features__card">
      <h3 class="features__title">Automation</h3>
      <p class="features__desc">Automate chats easily</p>
    </div>
  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
